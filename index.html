<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adaptive Alarm">
<meta name="theme-color" content="#0E1220">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Adaptive Alarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1220; --surface:#181D2E; --raised:#1E2540; --line:#262D45; --edge:#2C3558;
    --text:#EEF0F7; --muted:#9AA3BD; --soft:#C3C9DA;
    --amber:#F5B14C; --amber-ink:#1A1405; --good:#7DD3A8; --bad:#FF8A7A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  main{flex:1;padding:calc(env(safe-area-inset-top) + 24px) 20px 24px;display:flex;flex-direction:column;gap:16px}
  h1{margin:0;font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;line-height:1.1}
  h2{margin:0;font-size:16px;font-weight:600}
  p{margin:0}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .eyebrow.amber{color:var(--amber)}
  .muted{color:var(--muted)} .soft{color:var(--soft)}
  .small{font-size:13px} .xs{font-size:12px}
  .card{background:var(--surface);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
  .card.hi{background:var(--raised);border:1px solid var(--edge)}
  .big{font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;line-height:1}
  .mid{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;line-height:1.2}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat b{font-size:20px;font-weight:600}
  .btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:16px;border:none;background:var(--amber);color:var(--amber-ink);font-size:17px;font-weight:600;width:100%;padding:0 16px}
  .btn:disabled{background:#262D45;color:var(--muted);cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--amber);color:var(--amber)}
  .btn.dark{background:#262D45;color:var(--text)}
  .link{background:none;border:none;color:var(--amber);font-size:15px;font-weight:500;min-height:44px;padding:0 4px}
  .list{background:var(--surface);border-radius:22px;padding:2px 18px}
  .li{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:none}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:none}
  input[type=datetime-local],input[type=time]{background:#0E1220;border:1px solid var(--edge);border-radius:10px;padding:8px 10px;color:var(--text);color-scheme:dark;min-height:40px;font-size:15px}
  .step{display:flex;align-items:center;gap:10px}
  .step button{width:44px;height:44px;border-radius:22px;border:none;background:#262D45;font-size:22px}
  .step b{min-width:24px;text-align:center;font-size:20px}
  .grid10{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .grid10 button{height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600}
  .grid10 button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
  .bar{height:14px;background:var(--bg);border-radius:7px;flex:1;overflow:hidden}
  .bar i{display:block;height:14px;border-radius:7px}
  .pill{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:#262D45;color:var(--soft)}
  .notice{background:#2A2418;border:1px solid #4A3A1C;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45;color:#F3DDB4}
  .chart{height:110px;display:flex;align-items:flex-end;gap:8px}
  .chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
  .chart span{font-size:11px;color:var(--soft);font-weight:600}
  .chart i{display:block;width:100%;border-radius:6px}
  nav{position:sticky;bottom:0;background:#121729;border-top:1px solid #232A40;display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px)}
  nav button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;width:88px;min-height:48px}
  nav button[aria-current=page]{color:var(--amber)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);background:#EEF0F7;color:#0E1220;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.on{opacity:1}
  .sleeping-orb{width:200px;height:200px;border-radius:100px;background:#1A2142;display:flex;align-items:center;justify-content:center;align-self:center}
  .sleeping-orb div{width:140px;height:140px;border-radius:70px;background:#262F5A;display:flex;align-items:center;justify-content:center}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .text-in{width:100%;background:#0E1220;border:1px solid var(--edge);border-radius:12px;padding:12px 14px;color:var(--text);font-size:20px;font-family:'Space Grotesk',sans-serif;text-transform:uppercase;min-height:52px}
  textarea{width:100%;min-height:120px;background:#0E1220;border:1px solid var(--edge);border-radius:12px;color:var(--soft);font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px}
</style>
</head>
<body>
<div class="app">
  <main id="view" aria-live="polite"><p class="muted">Loading…</p></main>
  <nav aria-label="Tabs">
    <button data-tab="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2M5 4 2 7M19 4l3 3"/></svg>Tonight</button>
    <button data-tab="log"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Log</button>
    <button data-tab="insights"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Insights</button>
    <button data-tab="you"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>You</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  // =====================================================================
  // CONFIG: address of the backend API (see README).
  // '' means "same server that served this page" (the default: the backend
  // serves this app). If the app is hosted elsewhere, e.g. Vercel, put the
  // backend's full address here, like 'https://my-backend.example.com'.
  // =====================================================================
  var API_URL = '';

  var LS = {
    participant: 'aa_participant',
    active: 'aa_active',
    wake: 'aa_wake_target',
    cache: 'aa_nights_cache',
    queue: 'aa_queue'
  };
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // ---------- state ----------
  var S = {
    participant: lsGet(LS.participant, null),
    active: lsGet(LS.active, null),            // {bedAt}
    wakeTarget: lsGet(LS.wake, '08:00'),
    nights: lsGet(LS.cache, []),               // newest first
    loading: false, loadError: false,
    tab: 'home', checkin: null, confirmDelete: null,
    queue: lsGet(LS.queue, []),
    rec: null                                   // latest recommendation from the server
  };
  var view = document.getElementById('view');

  // ---------- helpers ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtTime(ms) { return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function fmtDay(ms) { return new Date(ms).toLocaleDateString([], { weekday: 'short' }); }
  function fmtDate(ms) { return new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' }); }
  function fmtDur(min) { min = Math.max(0, Math.round(min)); return Math.floor(min / 60) + 'h ' + (min % 60) + 'm'; }
  function hoursOf(n) { return (n.wakeAt - n.bedAt) / 3600000; }
  function toLocalInput(ms) {
    var d = new Date(ms), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fromLocalInput(v) { var t = new Date(v).getTime(); return isNaN(t) ? null : t; }
  function rateColor(r) { return r >= 8 ? 'var(--good)' : (r >= 6 ? 'var(--amber)' : 'var(--bad)'); }
  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  var toastT;
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2600); }
  function done() { return S.nights.filter(function (n) { return n.wakeAt && n.bedAt && n.rating; }); }
  function wakeTargetMin() { var p = (S.wakeTarget || '08:00').split(':'); return (+p[0]) * 60 + (+p[1]); }
  function minToLabel(m) {
    m = ((m % 1440) + 1440) % 1440; var d = new Date(2000, 0, 1, Math.floor(m / 60), m % 60);
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function sortNights() { S.nights.sort(function (a, b) { return b.bedAt - a.bedAt; }); }

  // ---------- API (FastAPI backend) ----------
  function api(method, path, body) {
    var opts = { method: method, headers: {} };
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    return fetch(API_URL + path, opts).then(function (r) {
      if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  }
  function nightPath(p, id) { return '/nights/' + encodeURIComponent(p) + '/' + encodeURIComponent(id); }
  // A queued change is {action:'upsert', participant, night, tzOffset} or {action:'delete', participant, id}.
  function sendOp(op) {
    if (op.action === 'delete') return api('DELETE', nightPath(op.participant, op.id));
    var n = op.night;
    return api('PUT', nightPath(op.participant, n.id),
      { bedAt: n.bedAt, wakeAt: n.wakeAt, snoozes: n.snoozes, rating: n.rating, tzOffset: op.tzOffset || 0 });
  }
  // The server refused this change itself (not a connection problem), so retrying can never succeed.
  function isRejected(e) { return e && e.status >= 400 && e.status < 500 && e.status !== 408 && e.status !== 429; }
  function enqueue(op) { S.queue.push(op); lsSet(LS.queue, S.queue); }
  var flushing = false;
  function flushQueue() {
    if (flushing || !S.queue.length) return Promise.resolve();
    flushing = true;
    var op = S.queue[0];
    return sendOp(op).then(function () {
      S.queue.shift(); lsSet(LS.queue, S.queue); flushing = false;
      if (!S.queue.length) { render(); loadRecommendation(); }
      return flushQueue();
    }, function (e) {
      flushing = false;
      if (isRejected(e)) {
        // Drop it so it doesn't block everything behind it.
        S.queue.shift(); lsSet(LS.queue, S.queue);
        toast('The server rejected one change, so it was skipped.');
        return flushQueue();
      }
      render();
    });
  }
  function fromServer(r) {
    return { id: String(r.client_id), bedAt: +r.bed_ms, wakeAt: +r.wake_ms, snoozes: +r.snoozes || 0, rating: +r.restedness };
  }
  function loadNights() {
    if (!S.participant) return;
    S.loading = true; S.loadError = false; render();
    flushQueue().then(function () { return api('GET', '/nights/' + encodeURIComponent(S.participant)); })
      .then(function (j) {
        var server = (j.nights || []).map(fromServer);
        // keep queued (not yet sent) changes on top of server data
        S.queue.forEach(function (op) {
          if (op.action === 'upsert') { server = server.filter(function (n) { return n.id !== op.night.id; }); server.push(op.night); }
          if (op.action === 'delete') { server = server.filter(function (n) { return n.id !== op.id; }); }
        });
        S.nights = server; sortNights(); lsSet(LS.cache, S.nights);
        S.loading = false; render();
        loadRecommendation();
      })
      .catch(function () { S.loading = false; S.loadError = true; render(); });
  }
  // Ask the team's model for tonight's bedtime. If it can't be reached, the local baseline below is used.
  var recSeq = 0;
  function loadRecommendation() {
    if (!S.participant) return;
    var seq = ++recSeq, wake = S.wakeTarget || '08:00';
    api('GET', '/recommendation/' + encodeURIComponent(S.participant) + '?wake_time=' + encodeURIComponent(wake))
      .then(function (r) { if (seq === recSeq) { S.rec = r; render(); } })
      .catch(function () { /* keep showing the local baseline */ });
  }

  // ---------- model (baseline; the team model can replace this) ----------
  var MIN_NIGHTS = 5, DEFAULT_HOURS = 8;
  function model() {
    var d = done();
    if (d.length < MIN_NIGHTS) return { ready: false, n: d.length, hours: DEFAULT_HOURS };
    var sorted = d.slice().sort(function (a, b) { return b.rating - a.rating; });
    var top = sorted.slice(0, Math.ceil(sorted.length / 2));
    var hrs = top.reduce(function (s, n) { return s + hoursOf(n); }, 0) / top.length;
    return { ready: true, n: d.length, hours: Math.min(10.5, Math.max(6, hrs)), top: top.length };
  }
  // What "Plan tonight" shows: the server's recommendation when we have one for the current
  // wake-up time and this phone's nights are all uploaded, otherwise the local baseline.
  function plan() {
    var r = S.rec;
    if (r && r.wake_time === (S.wakeTarget || '08:00') && !S.queue.length && isFinite(r.target_sleep_hours)) {
      var p = r.suggested_bedtime.split(':');
      return { ready: r.method !== 'default_8h', n: r.nights_logged, hours: r.target_sleep_hours,
               bedMin: (+p[0]) * 60 + (+p[1]), need: r.nights_until_personalized,
               src: r.method === 'experimental_mdp' ? 'model' : 'default' };
    }
    var m = model();
    return { ready: m.ready, n: m.n, hours: m.hours, need: Math.max(0, MIN_NIGHTS - m.n),
             bedMin: wakeTargetMin() - Math.round(m.hours * 12) * 5, top: m.top,
             src: m.ready ? 'baseline' : 'default' };
  }
  function bucketAvg(list, keyFn, buckets) {
    return buckets.map(function (b) {
      var xs = list.filter(function (n) { return b.test(keyFn(n)); });
      return { label: b.label, avg: xs.length ? xs.reduce(function (s, n) { return s + n.rating; }, 0) / xs.length : null, count: xs.length };
    });
  }

  // ---------- views ----------
  function vJoin() {
    return '<div><p class="eyebrow amber">Welcome</p><h1>Adaptive Alarm</h1></div>' +
      '<div class="card"><p class="soft" style="line-height:1.5">Each night you log when you went to sleep and woke up, how often you snoozed, and how rested you feel. Over time the app learns how much sleep you need and recommends a bedtime.</p></div>' +
      '<form id="joinForm" class="card" style="gap:10px"><label for="pcode"><h2>Your participant code</h2></label>' +
      '<p class="small muted">Use the code your team gave you, like P1. Your nights are saved under this code, not your name.</p>' +
      '<input id="pcode" class="text-in" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20" placeholder="P1" value="">' +
      '<p class="xs muted">Letters, numbers, - and _ only.</p>' +
      '<button class="btn" type="submit">Start</button></form>' +
      '<p class="xs muted" style="line-height:1.5">By continuing you agree to share your sleep log (times, snoozes and ratings) with the CS221 project team for this study. You can stop any time.</p>';
  }

  function vHome() {
    var a = S.active, m = plan(), last = done()[0];
    if (a) {
      var mins = (Date.now() - a.bedAt) / 60000;
      return '<p class="eyebrow amber">Sleeping</p><h1>Good night</h1>' +
        '<div class="sleeping-orb" aria-hidden="true"><div><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#C3C9DA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></div></div>' +
        '<div class="card"><div class="row"><span class="muted">In bed since</span><b>' + fmtTime(a.bedAt) + '</b></div>' +
        '<div class="row"><span class="muted">So far</span><b>' + fmtDur(mins) + '</b></div>' +
        '<div class="row"><span class="muted">Your iPhone alarm</span><b>' + minToLabel(wakeTargetMin()) + '</b></div></div>' +
        '<div style="flex:1"></div>' +
        '<button class="btn" data-act="wake">I’m awake</button>' +
        '<button class="link" data-act="cancelNight">I’m not going to sleep yet</button>';
    }
    var bedBy = minToLabel(m.bedMin);
    var html = '<div><p class="eyebrow">' + esc(new Date().toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })) + '</p><h1>Plan tonight</h1></div>';
    html += '<div class="card"><div class="row"><label for="wakeT" class="muted">Wake-up time</label>' +
      '<input id="wakeT" type="time" value="' + esc(S.wakeTarget) + '"></div>' +
      '<p class="small muted">Set the same time on your iPhone’s Clock alarm. This app logs your night and learns from it.</p></div>';
    html += '<div class="card hi"><p class="eyebrow amber">' + (m.ready ? 'Tonight’s recommendation' : 'Starting point') + '</p>' +
      '<p class="mid">Go to bed by ' + esc(bedBy) + '</p>' +
      '<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
      '<div class="stat"><span class="xs muted">Time asleep</span><b>' + fmtDur(m.hours * 60) + '</b></div>' +
      '<div class="stat"><span class="xs muted">Based on</span><b>' + (m.ready ? m.n + ' nights' : 'Default') + '</b></div></div>' +
      (m.ready ? '' : '<p class="small soft">Log ' + m.need + ' more night' + (m.need === 1 ? '' : 's') + ' for a personal recommendation.</p>') + '</div>';
    html += '<button class="btn" data-act="bed">Going to bed</button>';
    if (last) {
      html += '<div class="card"><div class="row"><h2>Last night</h2><button class="link" data-tab-go="log">See log</button></div>' +
        '<div class="stats"><div class="stat"><b>' + fmtDur(hoursOf(last) * 60) + '</b><span class="xs muted">Asleep</span></div>' +
        '<div class="stat"><b>' + last.snoozes + '</b><span class="xs muted">Snoozes</span></div>' +
        '<div class="stat"><b>' + last.rating + ' / 10</b><span class="xs muted">Rested</span></div></div></div>';
    }
    return html;
  }

  function vCheckin() {
    var c = S.checkin, nums = '';
    for (var i = 1; i <= 10; i++) nums += '<button type="button" data-rate="' + i + '" aria-pressed="' + (c.rating === i) + '">' + i + '</button>';
    var valid = c.bedAt && c.wakeAt && c.wakeAt > c.bedAt && (c.wakeAt - c.bedAt) < 20 * 3600000 && c.rating;
    var warn = '';
    if (c.bedAt && c.wakeAt && c.wakeAt <= c.bedAt) warn = '<p class="small" style="color:var(--bad)">Wake time must be after bedtime.</p>';
    else if (c.bedAt && c.wakeAt && (c.wakeAt - c.bedAt) >= 20 * 3600000) warn = '<p class="small" style="color:var(--bad)">That’s over 20 hours. Check the dates.</p>';
    return '<div class="row"><button class="link" data-act="closeCheckin">Cancel</button><span></span></div>' +
      '<div><p class="eyebrow amber">' + (c.isNew ? 'Add a night' : 'Morning check-in') + '</p><h1>How rested do you feel?</h1></div>' +
      '<fieldset style="border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px"><legend class="sr">Rested from 1 to 10</legend>' +
      '<div class="grid10">' + nums + '</div>' +
      '<div class="row"><span class="xs muted">Exhausted</span><span class="xs muted">Fully rested</span></div></fieldset>' +
      '<div class="card" style="padding:4px 20px;gap:0">' +
      '<div class="field"><label for="bedIn">Went to sleep</label><input id="bedIn" type="datetime-local" value="' + (c.bedAt ? toLocalInput(c.bedAt) : '') + '"></div>' +
      '<div class="field"><label for="wakeIn">Woke up</label><input id="wakeIn" type="datetime-local" value="' + (c.wakeAt ? toLocalInput(c.wakeAt) : '') + '"></div>' +
      '<div class="field"><span id="snzL">Snoozes</span><div class="step" role="group" aria-labelledby="snzL"><button type="button" data-act="snzMinus" aria-label="One fewer snooze">−</button><b>' + c.snoozes + '</b><button type="button" data-act="snzPlus" aria-label="One more snooze">+</button></div></div>' +
      '</div>' + warn +
      (c.bedAt && c.wakeAt && c.wakeAt > c.bedAt ? '<p class="small muted">Time asleep ' + fmtDur((c.wakeAt - c.bedAt) / 60000) + '</p>' : '') +
      '<div style="flex:1"></div>' +
      '<button class="btn" data-act="saveCheckin"' + (valid ? '' : ' disabled') + '>' + (c.rating ? 'Save ' + c.rating + ' / 10' : 'Pick a number to save') + '</button>' +
      (!c.isNew && c.fromLog ? (S.confirmDelete === c.id
        ? '<div class="row"><span class="small soft">Delete this night for good?</span><span><button class="link" data-act="noDelete">Keep</button><button class="link" style="color:var(--bad)" data-act="doDelete">Delete</button></span></div>'
        : '<button class="link" style="color:var(--bad)" data-act="askDelete">Delete this night</button>') : '');
  }

  function vLog() {
    var list = done();
    var html = '<div class="row"><h1>Sleep log</h1><button class="link" data-act="addNight">+ Add night</button></div>';
    if (S.loading && !list.length) return html + '<p class="muted">Loading your nights…</p>';
    if (!list.length) return html + '<div class="card"><h2>No nights yet</h2><p class="small soft">Tap “Going to bed” tonight and do the check-in when you wake. Forgot? Use “Add night”.</p></div>';
    var recent = list.slice(0, 14).reverse();
    html += '<div class="card"><div class="row"><h2>Rested score</h2><span class="pill">Last ' + recent.length + '</span></div><div class="chart" aria-hidden="true">' +
      recent.map(function (n) { return '<div><span>' + n.rating + '</span><i style="height:' + (n.rating * 8) + 'px;background:' + rateColor(n.rating) + '"></i></div>'; }).join('') + '</div></div>';
    html += '<div class="list">' + list.map(function (n) {
      return '<div class="li">' +
        '<div style="width:56px;display:flex;flex-direction:column"><b class="small">' + fmtDay(n.wakeAt) + '</b><span class="xs muted">' + fmtDate(n.wakeAt) + '</span></div>' +
        '<div style="flex:1;display:flex;flex-direction:column;min-width:0"><span class="small">' + fmtDur(hoursOf(n) * 60) + ' · ' + n.snoozes + ' snooze' + (n.snoozes === 1 ? '' : 's') + '</span><span class="xs muted">' + fmtTime(n.bedAt) + ' – ' + fmtTime(n.wakeAt) + '</span></div>' +
        '<b style="font-family:Space Grotesk,sans-serif;font-size:17px;color:' + rateColor(n.rating) + '">' + n.rating + '/10</b>' +
        '<button class="link small" data-edit="' + esc(n.id) + '" aria-label="Edit night of ' + esc(fmtDate(n.wakeAt)) + '">Edit</button></div>';
    }).join('') + '</div>';
    return html;
  }

  function vInsights() {
    var d = done(), p = plan();
    var wakeLbl = minToLabel(wakeTargetMin()), bedLbl = minToLabel(p.bedMin);
    var body;
    if (p.src === 'model') {
      body = 'Recommended by the team’s sleep model, which learns from your ' + p.n + ' logged nights, your recent sleep debt and how rested you felt. To wake up at ' + wakeLbl + ', aim for bed by ' + bedLbl + '.';
    } else if (p.src === 'baseline') {
      body = 'Couldn’t reach the sleep model, so this is the average time asleep on your ' + p.top + ' best-rated nights. To wake up at ' + wakeLbl + ', aim for bed by ' + bedLbl + '.';
    } else {
      body = 'Log ' + p.need + ' more night' + (p.need === 1 ? '' : 's') + ' and the sleep model will find your sweet spot. ' + p.n + ' logged so far.';
    }
    var html = '<h1>Insights</h1>';
    html += '<div class="card hi"><div class="row"><p class="eyebrow amber">Your sweet spot</p>' +
      (p.src === 'model' ? '<span class="pill">Sleep model</span>' : '') + '</div>' +
      '<p class="big" style="font-size:44px">' + (p.ready ? fmtDur(p.hours * 60) : '—') + '</p>' +
      '<p class="small soft">' + body + '</p></div>';
    if (!d.length) return html;
    function bars(title, rows) {
      return '<div class="card"><h2>' + title + '</h2>' + rows.map(function (r) {
        return '<div class="row" style="gap:10px"><span class="small muted" style="width:92px">' + r.label + '</span>' +
          '<div class="bar">' + (r.avg ? '<i style="width:' + (r.avg * 10) + '%;background:' + rateColor(r.avg) + '"></i>' : '') + '</div>' +
          '<b class="small" style="width:52px;text-align:right">' + (r.avg ? r.avg.toFixed(1) : '–') + '</b></div>' +
          '<p class="xs muted" style="margin-top:-8px;padding-left:102px">' + r.count + ' night' + (r.count === 1 ? '' : 's') + '</p>';
      }).join('') + '</div>';
    }
    html += bars('Avg rested score by time asleep', bucketAvg(d, hoursOf, [
      { label: 'Under 7h', test: function (h) { return h < 7; } },
      { label: '7h to 8h', test: function (h) { return h >= 7 && h < 8; } },
      { label: '8h to 9h', test: function (h) { return h >= 8 && h < 9; } },
      { label: '9h or more', test: function (h) { return h >= 9; } }
    ]));
    html += bars('Avg rested score by snoozes', bucketAvg(d, function (n) { return n.snoozes; }, [
      { label: 'No snoozes', test: function (s) { return s === 0; } },
      { label: '1 snooze', test: function (s) { return s === 1; } },
      { label: '2 or more', test: function (s) { return s >= 2; } }
    ]));
    html += '<div class="card"><h2>How this works</h2><p class="small soft" style="line-height:1.5">Each night records when you went to sleep, when you woke up, how many times you snoozed, and your 1 to 10 check-in. Your sweet spot and tonight’s bedtime come from the team’s sleep model, which learns which amount of sleep leaves you most rested given your recent nights. Offline, the app falls back to the average of your best-rated nights. It’s an experimental model, not medical advice.</p></div>';
    return html;
  }

  function vYou() {
    var pending = S.queue.length;
    return '<h1>You</h1>' +
      '<div class="card"><div class="row"><span class="muted">Participant code</span><b style="font-family:Space Grotesk,sans-serif;font-size:20px">' + esc(S.participant) + '</b></div>' +
      '<div class="row"><span class="muted">Nights logged</span><b>' + done().length + '</b></div>' +
      '<div class="row"><span class="muted">Waiting to upload</span><b>' + pending + '</b></div>' +
      (pending ? '<button class="btn ghost" data-act="retry">Upload now</button>' : '') + '</div>' +
      '<div class="card"><h2>Your data</h2><p class="small soft" style="line-height:1.5">Your nights are saved to the CS221 project team’s server under your participant code, not your name. The team uses them to train the sleep model. Ask the team to delete your rows any time.</p></div>' +
      '<button class="btn dark" data-act="refresh">Refresh from server</button>' +
      '<button class="link" data-act="switchCode">Use a different participant code</button>';
  }

  // ---------- render ----------
  function render() {
    var html, showNav = true;
    if (!S.participant) { html = vJoin(); showNav = false; }
    else if (S.checkin) { html = vCheckin(); showNav = false; }
    else html = ({ home: vHome, log: vLog, insights: vInsights, you: vYou })[S.tab]();
    if (S.participant && !S.checkin && (S.loadError || S.queue.length)) {
      html = '<div class="notice">' + (S.queue.length
        ? S.queue.length + ' change' + (S.queue.length === 1 ? '' : 's') + ' saved on this phone, waiting to upload. They’ll send when you’re online.'
        : 'Couldn’t reach the server. Showing nights saved on this phone.') + '</div>' + html;
    }
    view.innerHTML = html;
    document.querySelectorAll('nav button').forEach(function (b) {
      if (b.dataset.tab === S.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    document.querySelector('nav').style.display = showNav ? 'flex' : 'none';
  }

  // ---------- actions ----------
  function startCheckin(n, opts) {
    opts = opts || {};
    S.checkin = { id: n.id || newId(), bedAt: n.bedAt || null, wakeAt: n.wakeAt || null, snoozes: n.snoozes || 0, rating: n.rating || 0, isNew: !!opts.isNew, fromLog: !!opts.fromLog, fromActive: !!opts.fromActive };
    S.confirmDelete = null; render(); window.scrollTo(0, 0);
  }
  function save(op, localApply) {
    localApply(); sortNights(); lsSet(LS.cache, S.nights);
    enqueue(op); render();
    return flushQueue();
  }
  function act(name) {
    var c = S.checkin;
    switch (name) {
      case 'bed': S.active = { bedAt: Date.now() }; lsSet(LS.active, S.active); render(); toast('Logged. Sleep well.'); return;
      case 'wake': if (S.active) startCheckin({ bedAt: S.active.bedAt, wakeAt: Date.now() }, { fromActive: true }); return;
      case 'cancelNight': S.active = null; lsDel(LS.active); render(); return;
      case 'closeCheckin': S.checkin = null; S.confirmDelete = null; render(); return;
      case 'snzMinus': c.snoozes = Math.max(0, c.snoozes - 1); render(); return;
      case 'snzPlus': c.snoozes = Math.min(30, c.snoozes + 1); render(); return;
      case 'addNight': {
        var w = new Date(); w.setHours(Math.floor(wakeTargetMin() / 60), wakeTargetMin() % 60, 0, 0);
        if (w.getTime() > Date.now()) w.setDate(w.getDate() - 1);
        startCheckin({ bedAt: w.getTime() - 8 * 3600000, wakeAt: w.getTime() }, { isNew: true }); return;
      }
      case 'saveCheckin': {
        if (!(c.bedAt && c.wakeAt && c.wakeAt > c.bedAt && c.rating)) return;
        var night = { id: c.id, bedAt: c.bedAt, wakeAt: c.wakeAt, snoozes: c.snoozes, rating: c.rating };
        var op = { action: 'upsert', participant: S.participant, night: night, tzOffset: new Date(c.wakeAt).getTimezoneOffset() };
        if (c.fromActive) { S.active = null; lsDel(LS.active); }
        S.checkin = null; S.tab = 'log';
        save(op, function () { S.nights = S.nights.filter(function (n) { return n.id !== night.id; }); S.nights.push(night); })
          .then(function () { toast(S.queue.length ? 'Saved on this phone. Will upload when online.' : 'Saved. Thanks!'); });
        return;
      }
      case 'askDelete': S.confirmDelete = c.id; render(); return;
      case 'noDelete': S.confirmDelete = null; render(); return;
      case 'doDelete': {
        var id = c.id; S.checkin = null; S.confirmDelete = null;
        save({ action: 'delete', participant: S.participant, id: id }, function () { S.nights = S.nights.filter(function (n) { return n.id !== id; }); })
          .then(function () { toast('Deleted'); });
        return;
      }
      case 'retry': flushQueue().then(function () { render(); toast(S.queue.length ? 'Still offline. Try again later.' : 'Uploaded'); }); return;
      case 'refresh': loadNights(); return;
      case 'switchCode':
        if (S.queue.length) { toast('Upload pending changes first.'); return; }
        S.participant = null; S.nights = []; S.rec = null; lsDel(LS.participant); lsDel(LS.cache); render(); return;
    }
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t || t.disabled) return;
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.tabGo) { S.tab = t.dataset.tabGo; render(); return; }
    if (t.dataset.rate) { S.checkin.rating = +t.dataset.rate; render(); return; }
    if (t.dataset.edit) { var n = S.nights.find(function (x) { return x.id === t.dataset.edit; }); if (n) startCheckin(n, { fromLog: true }); return; }
    if (t.dataset.act) act(t.dataset.act);
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'joinForm') return;
    e.preventDefault();
    var v = (document.getElementById('pcode').value || '').trim().toUpperCase();
    if (!/^[A-Z0-9_-]{1,20}$/.test(v)) { toast('Use letters, numbers, - or _ only.'); return; }
    S.participant = v; lsSet(LS.participant, v); S.tab = 'home'; render(); loadNights();
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'bedIn') { S.checkin.bedAt = fromLocalInput(t.value); render(); }
    if (t.id === 'wakeIn') { S.checkin.wakeAt = fromLocalInput(t.value); render(); }
    if (t.id === 'wakeT' && t.value) { S.wakeTarget = t.value; lsSet(LS.wake, t.value); render(); loadRecommendation(); }
  });
  window.addEventListener('online', function () { flushQueue().then(render); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { flushQueue().then(render); } });

  // ---------- boot ----------
  render();
  loadNights();
  setInterval(function () { if (S.tab === 'home' && !S.checkin && S.active) render(); }, 60000);
})();
</script>
</body>
</html>
